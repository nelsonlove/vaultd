[package]
name = "vault-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "vaultd"
path = "src/main.rs"

[[bin]]
name = "vault-live-bench"
path = "src/bin/vault-live-bench.rs"

# Test support: prints the snapshot-page JSON for markdown on stdin, so the
# headless host's fixtures are produced by the real parser. See
# `src/fixture_row.rs`.
[[bin]]
name = "fixture-row"
path = "src/bin/fixture-row.rs"

[dependencies]
base64.workspace = true
clap.workspace = true
libc.workspace = true
serde.workspace = true
# `raw_value` only: the request payload is decoded straight from its input
# bytes so a nested JSON object's key order survives (see
# `stdio::RawRequestEnvelope`). This is unrelated to `preserve_order` — it
# does not change how `serde_json::Value`/`Map` order keys anywhere else in
# the workspace.
serde_json = { workspace = true, features = ["raw_value"] }
# The socket path digest. SHA-256 rather than the `blake3` the index identity
# uses, because the host's `vaultdSocketPathFor` is SHA-256 and the two must
# name the same file from the same vault root or `--listen` with no value and
# `engine: auto` would never meet.
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
vault-bases = { path = "../vault-bases" }
vault-core = { path = "../vault-core" }
vault-index = { path = "../vault-index" }
vault-protocol = { path = "../vault-protocol" }
vault-watch = { path = "../vault-watch" }
xdg.workspace = true

[dev-dependencies]
# An integration test is its own crate, so the normal dependency above does
# not reach it. `tests/socket_lifecycle.rs` sends SIGTERM to the daemon it
# spawned.
libc.workspace = true
tempfile.workspace = true
# `tests/bases_replay.rs`: the capture fixtures' renderer and template
# filler, and an order-keeping reader for `base:query`'s row objects.
serde.workspace = true
serde_json.workspace = true
vault-bases = { path = "../vault-bases", features = ["fixtures"] }
