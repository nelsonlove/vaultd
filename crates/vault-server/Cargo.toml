[package]
name = "vault-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "vaultd"
path = "src/main.rs"

[[bin]]
name = "vault-live-bench"
path = "src/bin/vault-live-bench.rs"

[dependencies]
base64.workspace = true
clap.workspace = true
libc.workspace = true
serde.workspace = true
# `raw_value` only: the request payload is decoded straight from its input
# bytes so a nested JSON object's key order survives (see
# `stdio::RawRequestEnvelope`). This is unrelated to `preserve_order` — it
# does not change how `serde_json::Value`/`Map` order keys anywhere else in
# the workspace.
serde_json = { workspace = true, features = ["raw_value"] }
tempfile.workspace = true
thiserror.workspace = true
vault-core = { path = "../vault-core" }
vault-index = { path = "../vault-index" }
vault-protocol = { path = "../vault-protocol" }
vault-watch = { path = "../vault-watch" }

[dev-dependencies]
tempfile.workspace = true
