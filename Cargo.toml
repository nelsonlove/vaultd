[workspace]
members = [
    "crates/vault-core",
    "crates/vault-index",
    "crates/vault-protocol",
    "crates/vault-server",
    "crates/vault-watch",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
base64 = "0.22.1"
blake3 = "1.8"
clap = { version = "4.6.6", features = ["derive"] }
filetime = "0.2.29"
fs2 = "0.4.3"
libc = "0.2.189"
notify = "8.2.0"
rusqlite = { version = "0.32.1", features = ["bundled", "trace"] }
sha2 = "0.10"
xdg = "3.0"
markdown = "1.0"
percent-encoding = "2.3"
proptest = "1.9"
regex = "1.12"
saphyr = { version = "0.0.12", default-features = false }
tempfile = "3.23"
trash = "5.2"
walkdir = "2.5"
