[workspace]
members = ["crates/vault-core", "crates/vault-protocol", "crates/vault-server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
blake3 = "1.8"
markdown = "1.0"
percent-encoding = "2.3"
proptest = "1.9"
regex = "1.12"
saphyr = { version = "0.0.12", default-features = false }
tempfile = "3.23"
walkdir = "2.5"
